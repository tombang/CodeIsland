name: Build Windows x64

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version written into the zip name. Leave empty for 0.2.1.
        required: false
        type: string
        default: "0.2.1"
  push:
    paths:
      - "windows/**"
      - "helpers/feishu-bridge/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - "helpers/feishu-bridge/**"
      - ".github/workflows/windows.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 package
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Show build environment
        shell: pwsh
        run: |
          dotnet --info
          [System.Environment]::OSVersion | Format-List | Out-String | Write-Host

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore CodeIsland.Windows.sln

      - name: Run unit tests
        shell: pwsh
        run: dotnet test CodeIsland.Core.Tests/CodeIsland.Core.Tests.csproj -c Release --no-restore

      - name: Build applications
        shell: pwsh
        run: |
          dotnet build CodeIsland.Windows/CodeIsland.Windows.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed" }
          dotnet build CodeIsland.Bridge/CodeIsland.Bridge.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Bridge build failed" }

      - name: Run smoke tests
        shell: pwsh
        run: dotnet run --project CodeIsland.Windows.Smoke/CodeIsland.Windows.Smoke.csproj -c Release --no-restore

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: helpers/feishu-bridge/go.sum

      - name: Build feishu-bridge.exe
        shell: pwsh
        working-directory: helpers/feishu-bridge
        run: |
          $dest = Join-Path $env:GITHUB_WORKSPACE "windows\artifacts\feishu"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags "-s -w" -o (Join-Path $dest "feishu-bridge.exe") .
          if ($LASTEXITCODE -ne 0) { throw "go build failed" }
          if (-not (Test-Path -LiteralPath (Join-Path $dest "feishu-bridge.exe"))) { throw "feishu-bridge.exe was not built" }

      - name: Package
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:INPUT_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "0.2.1" }
          Write-Host "Packaging version $version"
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/build-release.ps1 -Version $version

      - name: Verify package
        shell: pwsh
        run: |
          $manifest = Get-Content artifacts/release-manifest.json -Raw | ConvertFrom-Json
          $archive = Join-Path artifacts $manifest.archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $manifest.sha256) { throw "Archive hash mismatch" }
          if (-not (Test-Path artifacts/staging/CodeIsland.Windows.exe)) { throw "Desktop executable missing" }
          if (-not (Test-Path artifacts/staging/CodeIsland.Bridge.exe)) { throw "Bridge executable missing" }
          if (-not (Test-Path artifacts/staging/feishu-bridge.exe)) { throw "Feishu bridge executable missing" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $opened = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $archive))
          try {
            $found = $false
            foreach ($entry in $opened.Entries) {
              $name = $entry.FullName -replace '\\','/'
              if ($name -eq "feishu-bridge.exe" -or $name.EndsWith("/feishu-bridge.exe")) { $found = $true }
            }
            if (-not $found) { throw "Archive is missing feishu-bridge.exe" }
          } finally { $opened.Dispose() }
          Get-Item $archive | Select-Object FullName, Length | Format-List | Out-String | Write-Host

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: CodeIsland-windows-win-x64
          path: |
            windows/artifacts/*.zip
            windows/artifacts/release-manifest.json
          if-no-files-found: error
